name: CI
on:
  push:
    branches: [main]
    paths: [mikro_napari/**, tests/**, pyproject.toml, uv.lock]
  pull_request:
    branches: [main]
    paths: [mikro_napari/**, tests/**, pyproject.toml, uv.lock]
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Qt draws nowhere: no display server is needed.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: tlambert03/setup-qt-libs@v1
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked
      - name: Run Tests
        run: uv run pytest --cov --cov-report=xml -k "not integration"
  linux_integration:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: tlambert03/setup-qt-libs@v1
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked
      - name: Run Tests
        run: uv run pytest --cov --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
