[project]
name = "mikro-napari"
version = "0.1.63"
description = "A napari plugin to interact with and provide functionality for a connected arkitekt server"
readme = "README.md"
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
license = { text = "CC BY-NC 3.0" }
classifiers = ["Framework :: napari"]
requires-python = ">=3.11"
dependencies = [
    # rekuest serves the actions the plugin offers; since arkitekt 7 it is an extra.
    "arkitekt[qt,rekuest]>=6.1",
    # 2D ROIs (two-component vertices) need the mikro release after 7.0.0, and
    # "Stream ROIs" the koil release after 3.3.6 (a Qt generator that yields more
    # than once). Raise the floors to those releases once they are out.
    "mikro>=7.0",
    "koil>=3.3.6",
    "xarray>=2024.11.0",
    "numpy>=1.26",
    "qtpy>=2.4.3",
]

[project.urls]
Repository = "https://github.com/jhnnsrs/mikro-napari"

[project.scripts]
mikro-napari = "mikro_napari.run:main"

[project.entry-points."napari.manifest"]
mikro-napari = "mikro_napari:napari.yaml"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "ruff>=0.6",
    # 0.5 is where a layer names its dims and gives them units.
    "napari>=0.5",
    # Validates the one raw query against the schema the mikro client ships.
    "graphql-core>=3.2",
    # The Qt binding the tests run on (`qt_api` below); napari brings none of its own.
    "pyqt5>=5.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mikro_napari"]

[tool.mypy]
exclude = ["venv/"]
ignore_missing_imports = true


[tool.ruff.lint]
extend-select = ["ANN001","ANN204", "F401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 100

[[tool.pydoc-markdown.loaders]]
type = "python"
search_path = ["mikro_napari"]

[tool.pydoc-markdown.renderer]
type = "docusaurus"
docs_base_path = "website/docs"


[tool.pytest.ini_options]
qt_api = "pyqt5"
markers = [
    "integration: marks tests that require a running server",
    "qt: marks tests that require a running qt application",
]
